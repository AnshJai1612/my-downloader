<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media & Playlist Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --surface-hover: #1c1c21;
            --border: #27272a;
            --border-focus: #52525b;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent: #ffffff;
            --accent-text: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .main-wrapper {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }
        .title { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 6px; }
        .subtitle { color: var(--text-secondary); font-size: 0.95rem; }

        .input-box {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px 6px 6px 16px;
            gap: 8px;
        }

        .input-box:focus-within { border-color: var(--border-focus); }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
        }

        button.action-btn {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        button.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .playlist-builder {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            flex-direction: column;
            gap: 16px;
        }

        .playlist-builder.active { display: flex; }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .playlist-title { font-size: 1rem; font-weight: 600; }
        .track-count { color: var(--text-secondary); font-size: 0.85rem; }

        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .selection-tools { display: flex; gap: 8px; }
        .text-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .text-btn:hover { color: var(--text-primary); background: var(--surface-hover); }

        select {
            background: var(--bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .track-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .track-item input[type="checkbox"] { accent-color: var(--text-primary); cursor: pointer; }
        .track-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-container {
            min-height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-message {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .status-message.active { display: flex; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="header">
        <h1 class="title">Media Downloader</h1>
        <p class="subtitle">Extract MP3s, 1080p MP4s, or build custom ZIP playlists</p>
    </div>

    <div class="input-box">
        <input type="text" id="urlInput" placeholder="Paste link or playlist URL..." autocomplete="off">
        <button id="parseBtn" class="action-btn" onclick="parseUrl()">Load Link</button>
    </div>

    <div class="status-container">
        <div id="statusMessage" class="status-message">
            <div id="spinner" class="spinner"></div>
            <span id="statusText">Analyzing link structure...</span>
        </div>
    </div>

    <form id="downloadForm" action="/download_batch" method="POST" target="download_frame">
        <div id="playlistBuilder" class="playlist-builder">
            <div class="playlist-header">
                <span class="playlist-title" id="playlistTitle">Playlist</span>
                <span class="track-count" id="trackCount">0 tracks</span>
            </div>

            <div class="controls-bar">
                <div class="selection-tools">
                    <button type="button" class="text-btn" onclick="toggleAll(true)">Select All</button>
                    <button type="button" class="text-btn" onclick="toggleAll(false)">Deselect All</button>
                </div>
                <div>
                    <select name="format" id="formatSelect">
                        <option value="mp3">MP3 (320kbps Audio)</option>
                        <option value="mp4">1080p MP4 (Video)</option>
                    </select>
                </div>
            </div>

            <input type="hidden" name="playlist_title" id="hiddenPlaylistTitle">
            <div class="track-list" id="trackList"></div>

            <button type="submit" id="downloadBtn" class="action-btn" onclick="triggerDownloadState()" style="width: 100%;">
                Download Selected Tracks
            </button>
        </div>
    </form>
</div>

<iframe name="download_frame" style="display:none;"></iframe>

<script>
let currentTracks = [];

async function parseUrl() {
    const url = document.getElementById('urlInput').value.trim();
    const parseBtn = document.getElementById('parseBtn');
    const statusMessage = document.getElementById('statusMessage');
    const statusText = document.getElementById('statusText');
    const playlistBuilder = document.getElementById('playlistBuilder');

    if (!url) return;

    parseBtn.disabled = true;
    statusMessage.classList.add('active');
    statusText.innerText = 'Extracting media metadata...';
    playlistBuilder.classList.remove('active');

    try {
        const res = await fetch('/parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
        });

        const data = await res.json();

        if (data.error) throw new Error(data.error);

        currentTracks = data.tracks || [];
        renderTrackList(data.playlist_title);
        playlistBuilder.classList.add('active');
        statusMessage.classList.remove('active');

    } catch (err) {
        statusText.innerText = 'Error: ' + err.message;
        setTimeout(() => statusMessage.classList.remove('active'), 4000);
    } finally {
        parseBtn.disabled = false;
    }
}

function renderTrackList(title) {
    const trackList = document.getElementById('trackList');
    document.getElementById('playlistTitle').innerText = title;
    document.getElementById('hiddenPlaylistTitle').value = title;
    document.getElementById('trackCount').innerText = `${currentTracks.length} items found`;

    trackList.innerHTML = '';
    currentTracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `
            <input type="checkbox" name="urls" value="${track.url}" id="chk_${index}" checked>
            <label for="chk_${index}" class="track-name" title="${track.title}">${track.title}</label>
        `;
        trackList.appendChild(item);
    });
}

function toggleAll(select) {
    document.querySelectorAll('#trackList input[type="checkbox"]').forEach(chk => {
        chk.checked = select;
    });
}

function triggerDownloadState() {
    const statusMessage = document.getElementById('statusMessage');
    const statusText = document.getElementById('statusText');
    const fmt = document.getElementById('formatSelect').value;

    statusMessage.classList.add('active');
    statusText.innerText = fmt === 'mp3' ? 'Processing & packaging MP3s...' : 'Merging & packaging 1080p MP4s...';

    setTimeout(() => {
        statusText.innerText = 'Download archive generated!';
        setTimeout(() => statusMessage.classList.remove('active'), 5000);
    }, 6000);
}

document.getElementById('urlInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') parseUrl();
});
</script>

</body>
</html>
