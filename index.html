<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1080p Media Downloader</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>1080p Media Downloader</h2>
    <input type="text" id="urlInput" placeholder="Paste video link here...">
    <button onclick="downloadVideo()">Download 1080p MP4</button>
    <div id="status"></div>
</div>

<script>
function downloadVideo() {
    const url = document.getElementById('urlInput').value;
    const status = document.getElementById('status');

    if (!url) {
        alert('Please paste a URL');
        return;
    }

    status.innerText = 'Processing video & merging audio... Please wait...';

    // Trigger attachment download directly in browser
    window.location.href = `/download?url=${encodeURIComponent(url)}`;

    setTimeout(() => {
        status.innerText = 'Download initiated!';
    }, 5000);
}
</script>

</body>
</html>
